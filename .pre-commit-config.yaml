# Pre-commit hooks. Tool versions are pinned by the project (uv.lock) and invoked via
# `uv run` so local commits, CI and the Makefile all use *identical* tool versions.
# Install with: `uv run pre-commit install`
minimum_pre_commit_version: "3.8.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: black
        name: black (format)
        entry: uv run black
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy (strict types)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
