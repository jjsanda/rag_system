apiVersion: v1
kind: Pod
metadata:
  name: {{ include "rag-system.fullname" . }}-test-connection
  labels:
    {{- include "rag-system.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: curlimages/curl:8.11.1
      command:
        - curl
        - -sf
        - http://{{ include "rag-system.fullname" . }}-api:{{ .Values.api.service.port }}/health
